version: "3.9"

services:
  nginx-rtmp:
    image: tiangolo/nginx-rtmp
    container_name: vibevision-stream
    restart: unless-stopped

    ports:
      - "1935:1935"
      - "8080:8080"

    volumes:
      - ./streaming/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./streaming/hls:/tmp/hls
      - ./streaming/recordings:/tmp/recordings
